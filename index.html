<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Countries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Press+Start+2P&family=Quicksand:wght@300..700&family=Roboto:ital,wdth,wght@0,75..100,200;1,75..100,200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="theme-dark">
    <header class="header-container">
      <a class="brand" href="#home">Where in the world?</a>
      <div class="theme-toggle">
        <button id="btn" class="toggle-btn">
          <img src="./Assets/Path.svg" alt="icon" class="icon-light" />Dark Mode
        </button>
      </div>
    </header>
    <main class="main-container">
      <section class="section-container-first">
        <div class="search-container">
          <label class="search-bar">
            <img src="./Assets/search.svg" class="icon" alt="icon" />
            <input
              class="search-input"
              type="search"
              name="search"
              placeholder="Search for a country"
            />
          </label>
        </div>
        <div class="filter-container">
          <select class="filter-dropdown" name="filter" id="dropdown">
            <option value="" disabled selected>Filter by Region</option>
            <option value="search">Arica</option>
            <option value="search">America</option>
            <option value="search">Asia</option>
            <option value="search">Europe</option>
            <option value="search">Oceania</option>
          </select>
        </div>
      </section>
      <div class="cards-container">
        <div class="country-card">
          <div class="country-info">
            <img src="./Assets/images.png" alt="germany" />
          </div>
          <div class="country-details">
            <h2>Germany</h2>
            <div class="details">
              <p><strong>Population:</strong> 81,120,123</p>
              <p><strong>Region:</strong> Europe</p>
              <p><strong>Capital:</strong> Berlin</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="./js/app.js"></script>
</html>
