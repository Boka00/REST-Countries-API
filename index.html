<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Countries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Press+Start+2P&family=Quicksand:wght@300..700&family=Roboto:ital,wdth,wght@0,75..100,200;1,75..100,200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="">
    <header class="header-container">
      <a class="brand" href="./index.html">Where in the world?</a>
      <div class="theme-toggle">
        <button id="btn" class="toggle-btn">
          <img src="./Assets/Path.svg" alt="icon" class="icon" />
          <p class="theme-p">Dark Mode</p>
        </button>
      </div>
    </header>
    <main class="main-container">
      <section class="section-container-first">
        <div class="search-container">
          <label class="search-bar">
            <img src="./Assets/search.svg" class="icon" alt="icon" />
            <input
              class="search-input"
              type="search"
              name="search"
              placeholder="Search for a country"
            />
          </label>
        </div>
        <div class="filter-container">
          <select class="filter-dropdown" name="filter" id="dropdown">
            <option value="" disabled selected class="hidden">
              Filter by Region
            </option>
            <option value="all">All Regions</option>
            <option value="Africa">Africa</option>
            <option value="Americas">America</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
          </select>
        </div>
      </section>
      <div class="cards-container">
        <!-- country  cards  HERE -->
      </div>
    </main>
  </body>
  <script src="./js/app.js"></script>
</html>
