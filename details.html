<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Countries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Press+Start+2P&family=Quicksand:wght@300..700&family=Roboto:ital,wdth,wght@0,75..100,200;1,75..100,200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/details.css" />
  </head>
  <body class="">
    <header class="header-container">
      <a class="brand" href="./index.html">Where in the world?</a>
      <div class="theme-toggle">
        <button id="btn" class="toggle-btn">
          <img src="./Assets/Path.svg" alt="icon" class="icon" />
          <p class="theme-p">Dark Mode</p>
        </button>
      </div>
    </header>
    <main class="country-container">
      <div class="layout-container">
        <button id="back-btn" class="back-btn">
          <img src="./Assets/call-made.svg" alt="arrow" />
          <p>Back</p>
        </button>
        <div class="country-info country-container">
          <img class="country-img" src="./Assets/images.png" alt="lag" />
          <div class="country-details">
            <h2>Belgium</h2>
            <div class="country-stats">
              <div class="section-container">
                <div class="main-details">
                  <p><strong>Native Name:</strong> België</p>
                  <p><strong>Population:</strong> 11,319,511</p>
                  <p><strong> Region:</strong> Europe</p>
                  <p><strong>Sub Region:</strong> Western Europe</p>
                  <p><strong>Capital:</strong> Brussels</p>
                </div>
                <div class="more-details">
                  <p><strong>Top Level Domain:</strong> .be</p>
                  <p><strong>Currencies:</strong> Euro</p>
                  <p><strong>Languages:</strong> Dutch, French, German</p>
                </div>
              </div>
              <div class="border-countries">
                <h3>Border Countries:</h3>
                <div class="btn-container">
                  <button class="btn" id="country-btn">France</button>
                  <button class="btn" id="country-btn">Germany</button>
                  <button class="btn" id="country-btn">Netherlands</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <!-- <script src="./js/app.js"></script> -->
  <!-- <script src="./js/app.js"></script>
  <script src="./js/details.js"></script> -->
</html>
